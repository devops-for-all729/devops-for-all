<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- warm sand background -->
  <rect width="1200" height="800" fill="#f4efec"/>

  <!-- infinity loop motif -->
  <g fill="none" stroke="#73a89a" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M 520 150 C 520 90, 600 90, 600 150 C 600 210, 520 210, 520 150 Z"/>
    <path d="M 600 150 C 600 90, 680 90, 680 150 C 680 210, 600 210, 600 150 Z"/>
  </g>

  <!-- conveyor belt -->
  <rect x="120" y="470" width="960" height="34" rx="17" fill="#251f21"/>
  <g fill="#f4efec">
    <circle cx="170" cy="487" r="7"/><circle cx="230" cy="487" r="7"/><circle cx="290" cy="487" r="7"/>
    <circle cx="350" cy="487" r="7"/><circle cx="410" cy="487" r="7"/><circle cx="470" cy="487" r="7"/>
    <circle cx="530" cy="487" r="7"/><circle cx="590" cy="487" r="7"/><circle cx="650" cy="487" r="7"/>
    <circle cx="710" cy="487" r="7"/><circle cx="770" cy="487" r="7"/><circle cx="830" cy="487" r="7"/>
    <circle cx="890" cy="487" r="7"/><circle cx="950" cy="487" r="7"/><circle cx="1010" cy="487" r="7"/>
  </g>
  <rect x="140" y="504" width="18" height="60" fill="#251f21"/>
  <rect x="1042" y="504" width="18" height="60" fill="#251f21"/>

  <!-- shipping containers on the belt -->
  <g>
    <rect x="300" y="392" width="130" height="78" rx="6" fill="#73a89a"/>
    <g stroke="#5c8a7e" stroke-width="5">
      <line x1="322" y1="398" x2="322" y2="464"/><line x1="344" y1="398" x2="344" y2="464"/>
      <line x1="366" y1="398" x2="366" y2="464"/><line x1="388" y1="398" x2="388" y2="464"/>
      <line x1="410" y1="398" x2="410" y2="464"/>
    </g>
    <rect x="560" y="392" width="130" height="78" rx="6" fill="#e4b343"/>
    <g stroke="#b8892e" stroke-width="5">
      <line x1="582" y1="398" x2="582" y2="464"/><line x1="604" y1="398" x2="604" y2="464"/>
      <line x1="626" y1="398" x2="626" y2="464"/><line x1="648" y1="398" x2="648" y2="464"/>
      <line x1="670" y1="398" x2="670" y2="464"/>
    </g>
    <rect x="800" y="392" width="130" height="78" rx="6" fill="#73a89a"/>
    <g stroke="#5c8a7e" stroke-width="5">
      <line x1="822" y1="398" x2="822" y2="464"/><line x1="844" y1="398" x2="844" y2="464"/>
      <line x1="866" y1="398" x2="866" y2="464"/><line x1="888" y1="398" x2="888" y2="464"/>
      <line x1="910" y1="398" x2="910" y2="464"/>
    </g>
  </g>

  <!-- laptop on the left -->
  <g>
    <rect x="90" y="300" width="170" height="110" rx="10" fill="#251f21"/>
    <rect x="102" y="312" width="146" height="86" rx="5" fill="#ffffff"/>
    <polyline points="116,380 140,352 162,366 190,334 232,352" fill="none" stroke="#73a89a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="410" width="210" height="14" rx="7" fill="#251f21"/>
  </g>

  <!-- cloud and server racks on the right -->
  <g>
    <path d="M 980 300 a 55 55 0 0 1 108 -18 a 45 45 0 0 1 82 30 a 42 42 0 0 1 -18 78 l -160 0 a 40 40 0 0 1 -12 -90 Z" fill="#ffffff" stroke="#251f21" stroke-width="8"/>
    <g>
      <rect x="1000" y="560" width="120" height="46" rx="6" fill="#251f21"/>
      <circle cx="1020" cy="583" r="6" fill="#73a89a"/>
      <rect x="1040" y="576" width="60" height="14" rx="7" fill="#585254"/>
      <rect x="1000" y="614" width="120" height="46" rx="6" fill="#251f21"/>
      <circle cx="1020" cy="637" r="6" fill="#73a89a"/>
      <rect x="1040" y="630" width="60" height="14" rx="7" fill="#585254"/>
      <rect x="1000" y="668" width="120" height="46" rx="6" fill="#251f21"/>
      <circle cx="1020" cy="691" r="6" fill="#e4b343"/>
      <rect x="1040" y="684" width="60" height="14" rx="7" fill="#585254"/>
    </g>
  </g>

  <!-- gears -->
  <g fill="#251f21">
    <g transform="translate(470,300)">
      <circle r="34"/><circle r="14" fill="#f4efec"/>
      <g>
        <rect x="-6" y="-48" width="12" height="20" rx="4"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(45)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(90)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(135)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(180)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(225)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(270)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(315)"/>
      </g>
    </g>
    <g transform="translate(740,290) scale(0.7)">
      <circle r="34"/><circle r="14" fill="#f4efec"/>
      <g>
        <rect x="-6" y="-48" width="12" height="20" rx="4"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(45)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(90)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(135)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(180)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(225)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(270)"/>
        <rect x="-6" y="-48" width="12" height="20" rx="4" transform="rotate(315)"/>
      </g>
    </g>
  </g>

  <!-- monitoring panel -->
  <g>
    <rect x="330" y="560" width="300" height="150" rx="14" fill="#ffffff" stroke="#eae9ea" stroke-width="3"/>
    <g stroke="#eae9ea" stroke-width="2">
      <line x1="356" y1="600" x2="604" y2="600"/><line x1="356" y1="635" x2="604" y2="635"/><line x1="356" y1="670" x2="604" y2="670"/>
    </g>
    <polyline points="356,668 400,640 444,652 488,616 532,628 576,592 604,600" fill="none" stroke="#73a89a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="576" cy="592" r="7" fill="#73a89a"/>
  </g>

  <!-- small decorative dots -->
  <g fill="#73a89a" opacity="0.5">
    <circle cx="200" cy="200" r="8"/><circle cx="1000" cy="180" r="8"/>
    <circle cx="880" cy="230" r="6"/><circle cx="150" cy="640" r="8"/>
    <circle cx="700" cy="700" r="6"/><circle cx="400" cy="240" r="6"/>
  </g>
</svg>
